<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | FarmConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">

    <div class="logo">
        🌾 FarmConnect
    </div>

    <a href="customer.html" class="secondary-btn">
        ← Marketplace
    </a>

</header>


<section class="product-detail-section">

    <div id="productDetails"></div>

</section>


<script src="js/products.js"></script>


<script>

const params = new URLSearchParams(window.location.search);

const productId = params.get("product");

const productDetails =
    document.getElementById("productDetails");


/* Find product */

function findProduct() {

    /* Farmer-added product */

    if (productId && productId.startsWith("farmer_")) {

        const farmerId =
            productId.replace("farmer_", "");

        const farmerProducts =
            JSON.parse(
                localStorage.getItem("farmConnectProducts")
            ) || [];

        return farmerProducts.find(
            product => product.id === farmerId
        );
    }


    /* Demo product */

    const categories = [
        "fruits",
        "vegetables",
        "grains"
    ];


    for (const category of categories) {

        const products =
            demoProducts[category] || [];

        const product =
            products.find(
                item => item.id === productId
            );

        if (product) {

            return product;

        }

    }


    return null;
}


const product = findProduct();


/* Product not found */

if (!product) {

    productDetails.innerHTML = `

        <div class="empty-state">

            <h2>Product not found ❌</h2>

            <p>
                This product is no longer available.
            </p>

            <br>

            <a href="customer.html" class="main-btn">
                Back to Marketplace
            </a>

        </div>

    `;

}


/* Display product */

else {

    const optionText =
        product.option === "self"
        ? "🛍 Self Buying / Pickup"
        : "🚚 Delivery Available";


    const location =
        product.location ||
        product.distance ||
        "Location not available";


    const availableQuantity =
        product.quantity || "Available";


    productDetails.innerHTML = `

        <div class="product-detail-card">


            <div class="product-detail-image">

                <span style="font-size:130px;">
                    ${product.emoji}
                </span>

            </div>


            <div class="product-detail-info">

                <span class="product-category">
                    ${product.category || "Fresh Product"}
                </span>


                <h1>
                    ${product.name}
                </h1>


                <h2 class="product-price">
                    ₹${product.price}/kg
                </h2>


                <div class="farmer-info">

                    <h3>👨‍🌾 Farmer Details</h3>

                    <p>
                        <strong>Farmer:</strong>
                        ${product.farmer}
                    </p>

                    <p>
                        <strong>📍 Location:</strong>
                        ${location}
                    </p>

                </div>


                <div class="buying-option">

                    <strong>
                        Customer Buying Option
                    </strong>

                    <p>
                        ${optionText}
                    </p>

                </div>


                <div class="quantity-info">

                    <strong>
                        Available Quantity:
                    </strong>

                    <p>
                        ${availableQuantity}
                        ${product.quantity ? "kg" : ""}
                    </p>

                </div>


                <div class="quantity-box">

                    <label>
                        Select Quantity (kg)
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        value="1"
                        min="1"
                        max="${
                            product.quantity || 9999
                        }"
                    >

                </div>


                <div class="product-actions">

                    <button
                        class="main-btn"
                        onclick="addToCart()"
                    >
                        🛒 Add to Cart
                    </button>


                    <a
                        href="customer.html"
                        class="secondary-btn"
                    >
                        Continue Shopping
                    </a>

                </div>


                <div class="direct-selling-note">

                    <h3>🌱 Direct Farmer Selling</h3>

                    <p>
                        Buy directly from the farmer
                        without unnecessary intermediaries.
                    </p>

                </div>

            </div>

        </div>

    `;

}


/* Add to Cart */

function addToCart() {

    if (!product) return;


    const quantity =
        parseInt(
            document.getElementById("quantity").value
        );


    if (!quantity || quantity < 1) {

        alert("Please enter a valid quantity.");

        return;
    }


    if (
        product.quantity &&
        quantity > Number(product.quantity)
    ) {

        alert(
            "Only " +
            product.quantity +
            " kg is available."
        );

        return;
    }


    let cart =
        JSON.parse(
            localStorage.getItem("farmConnectCart")
        ) || [];


    const existingIndex =
        cart.findIndex(
            item => item.productId === product.id
        );


    if (existingIndex !== -1) {

        cart[existingIndex].quantity += quantity;

    }

    else {

        cart.push({

            productId: product.id,

            name: product.name,

            price: Number(product.price),

            emoji: product.emoji,

            farmer: product.farmer,

            distance:
                product.distance ||
                product.location,

            location:
                product.location || "",

            option: product.option,

            quantity: quantity

        });

    }


    localStorage.setItem(
        "farmConnectCart",
        JSON.stringify(cart)
    );


    alert(
        product.name +
        " added to cart successfully! 🛒"
    );


    window.location.href = "cart.html";

}

</script>

</body>
</html>
