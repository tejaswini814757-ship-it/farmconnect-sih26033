<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FarmConnect | Product Details</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f8f5;
            color: #222;

            animation: pageEnter 0.55s ease-out;
        }

        @keyframes pageEnter {

            from {
                opacity: 0;
                transform: translateY(70px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ==============================
           HEADER
        ============================== */

        .topbar {

            background: white;

            padding: 16px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 2px 12px
                rgba(0,0,0,0.08);

            position: sticky;

            top: 0;

            z-index: 100;

        }


        .logo {

            color: #198754;

            font-size: 24px;

            font-weight: bold;

        }


        .header-actions {

            display: flex;

            gap: 10px;

            align-items: center;

        }


        .back-btn,
        .cart-btn {

            text-decoration: none;

            padding: 10px 15px;

            border-radius: 10px;

            font-weight: bold;

        }


        .back-btn {

            color: #555;

            background: #f1f1f1;

        }


        .cart-btn {

            color: #198754;

            background: #edf8f1;

        }


        /* ==============================
           MAIN CONTAINER
        ============================== */

        .product-container {

            width: 92%;

            max-width: 1100px;

            margin: 45px auto 70px;

        }


        .product-card {

            background: white;

            border-radius: 24px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.08);

            overflow: hidden;

            display: grid;

            grid-template-columns:
                1fr 1fr;

        }


        /* ==============================
           PRODUCT IMAGE
        ============================== */

        .product-image-section {

            min-height: 500px;

            background:
                linear-gradient(
                    135deg,
                    #edf8f1,
                    #f7fbf5
                );

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        #productImage {

            width: 100%;

            height: 430px;

            border-radius: 20px;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            background: white;

        }


        #productImage img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .big-emoji {

            font-size: 150px;

        }


        /* ==============================
           PRODUCT INFORMATION
        ============================== */

        .product-info-section {

            padding: 45px;

        }


        .category-label {

            display: inline-block;

            background: #edf8f1;

            color: #198754;

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        #productName {

            font-size: 38px;

            margin: 0 0 12px;

        }


        #productPrice {

            color: #198754;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 25px;

        }


        .details-box {

            border-top: 1px solid #eee;

            border-bottom: 1px solid #eee;

            padding: 20px 0;

            margin-bottom: 25px;

        }


        .detail-row {

            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 9px 0;

            font-size: 15px;

        }


        .detail-label {

            color: #777;

        }


        .detail-value {

            font-weight: bold;

            text-align: right;

        }


        .available-box {

            background: #f7faf7;

            padding: 14px;

            border-radius: 12px;

            margin-bottom: 20px;

            color: #444;

        }


        /* ==============================
           QUANTITY
        ============================== */

        .quantity-title {

            font-weight: bold;

            margin-bottom: 10px;

        }


        .quantity-control {

            display: flex;

            align-items: center;

            width: fit-content;

            border: 1px solid #ddd;

            border-radius: 12px;

            overflow: hidden;

            margin-bottom: 25px;

        }


        .quantity-control button {

            width: 45px;

            height: 45px;

            border: none;

            background: #f2f2f2;

            font-size: 22px;

            cursor: pointer;

        }


        #buyQuantity {

            width: 65px;

            height: 45px;

            border: none;

            text-align: center;

            font-size: 17px;

            outline: none;

        }


        /* ==============================
           BUTTONS
        ============================== */

        .action-buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

        }


        .action-btn {

            border: none;

            padding: 15px;

            border-radius: 12px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        .cart-action {

            background: #fff3e8;

            color: #e66b00;

        }


        .buy-action {

            background: #198754;

            color: white;

        }


        .action-btn:hover {

            transform: translateY(-2px);

        }


        /* ==============================
           INFO SECTION
        ============================== */

        .benefits {

            margin-top: 25px;

            display: grid;

            gap: 10px;

        }


        .benefit {

            background: #f8faf8;

            padding: 12px;

            border-radius: 10px;

            font-size: 14px;

        }


        /* ==============================
           MOBILE
        ============================== */

        @media(max-width: 800px) {

            .product-card {

                grid-template-columns: 1fr;

            }


            .product-image-section {

                min-height: 350px;

                padding: 20px;

            }


            #productImage {

                height: 330px;

            }


            .product-info-section {

                padding: 28px 22px;

            }


            #productName {

                font-size: 30px;

            }


            #productPrice {

                font-size: 24px;

            }

        }


        @media(max-width: 500px) {

            .logo {

                font-size: 19px;

            }


            .back-btn {

                display: none;

            }


            .product-container {

                margin-top: 25px;

            }


            .action-buttons {

                grid-template-columns: 1fr;

            }


            .detail-row {

                font-size: 14px;

            }

        }

    </style>

</head>


<body>


<!-- ==============================
     HEADER
============================== -->

<header class="topbar">

    <div class="logo">

        🌱 FarmConnect

    </div>


    <div class="header-actions">

        <a
            href="customer.html"
            class="back-btn">

            ← Back

        </a>


        <a
            href="cart.html"
            class="cart-btn">

            🛒 Cart

        </a>

    </div>

</header>



<!-- ==============================
     PRODUCT
============================== -->

<main class="product-container">


    <div class="product-card">


        <!-- PRODUCT IMAGE -->

        <section class="product-image-section">

            <div id="productImage">

                <div class="big-emoji">
                    🌾
                </div>

            </div>

        </section>



        <!-- PRODUCT INFORMATION -->

        <section class="product-info-section">


            <div class="category-label">

                🌱 Direct From Farmer

            </div>


            <h1 id="productName">

                Product

            </h1>


            <div id="productPrice">

                ₹0 / kg

            </div>



            <!-- DETAILS -->

            <div class="details-box">


                <div class="detail-row">

                    <span class="detail-label">

                        Farmer

                    </span>

                    <span
                        class="detail-value"
                        id="productFarmer">

                        —

                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">

                        Location

                    </span>

                    <span
                        class="detail-value"
                        id="productLocation">

                        —

                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">

                        Distance

                    </span>

                    <span
                        class="detail-value"
                        id="productDistance">

                        —

                    </span>

                </div>


                <div class="detail-row">

                    <span class="detail-label">

                        Buying Option

                    </span>

                    <span
                        class="detail-value"
                        id="buyingOption">

                        —

                    </span>

                </div>

            </div>



            <!-- AVAILABLE QUANTITY -->

            <div
                class="available-box"
                id="availableQuantity">

                📦 Available: —

            </div>



            <!-- QUANTITY -->

            <div class="quantity-title">

                Select Quantity (kg)

            </div>


            <div class="quantity-control">


                <button
                    type="button"
                    onclick="decreaseQuantity()">

                    −

                </button>


                <input
                    type="number"
                    id="buyQuantity"
                    value="1"
                    min="1"
                    readonly>


                <button
                    type="button"
                    onclick="increaseQuantity()">

                    +

                </button>


            </div>



            <!-- ACTION BUTTONS -->

            <div class="action-buttons">


                <button
                    type="button"
                    class="action-btn cart-action"
                    onclick="addToCart()">

                    🛒 Add to Cart

                </button>


                <button
                    type="button"
                    class="action-btn buy-action"
                    onclick="buyNow()">

                    ⚡ Buy Now

                </button>


            </div>



            <!-- BENEFITS -->

            <div class="benefits">


                <div class="benefit">

                    🌾 Direct farmer connection

                </div>


                <div class="benefit">

                    💰 Fair pricing for farmers

                </div>


                <div class="benefit">

                    🚚 Delivery or self-pickup

                </div>


                <div class="benefit">

                    📍 Nearby local produce

                </div>

            </div>


        </section>


    </div>


</main>



<!-- PRODUCT DATABASE -->

<script src="js/products.js"></script>


<!-- PRODUCT LOGIC -->

<script src="js/product.js"></script>


</body>

                  </html>
