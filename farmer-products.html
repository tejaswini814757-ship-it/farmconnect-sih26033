<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Products | FarmConnect</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f5f8f5;

            color: #18251c;

            animation:
                pageEnter
                0.6s
                ease-out;

        }

        @keyframes pageEnter {

            from {
                opacity: 0;
                transform: translateY(70px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* HEADER */

        .header {

            background: white;

            padding: 16px 6%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 2px 12px
                rgba(0,0,0,0.08);

            position: sticky;

            top: 0;

            z-index: 10;

        }

        .logo {

            color: #198754;

            font-size: 22px;

            font-weight: bold;

        }

        .back-btn {

            text-decoration: none;

            background: #edf8f1;

            color: #198754;

            padding: 9px 14px;

            border-radius: 9px;

            font-weight: bold;

        }


        /* MAIN */

        .container {

            width: 92%;

            max-width: 1000px;

            margin: 30px auto 60px;

        }


        .heading {

            text-align: center;

            margin-bottom: 25px;

        }

        .heading h1 {

            margin: 0;

            font-size: 30px;

        }

        .heading p {

            color: #666;

            margin-top: 8px;

        }


        /* ADD BUTTON */

        .add-btn {

            display: block;

            width: fit-content;

            margin: 0 auto 30px;

            padding: 14px 22px;

            background: #198754;

            color: white;

            text-decoration: none;

            border-radius: 11px;

            font-weight: bold;

            transition: 0.25s;

        }

        .add-btn:hover {

            background: #146c43;

            transform:
                translateY(-2px);

        }


        /* PRODUCT GRID */

        #productsContainer {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 22px;

        }


        /* PRODUCT CARD */

        .product-card {

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                0 5px 22px
                rgba(0,0,0,0.08);

            animation:
                cardEnter
                0.55s
                ease-out both;

        }

        @keyframes cardEnter {

            from {

                opacity: 0;

                transform:
                    translateY(70px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* PHOTO */

        .photo {

            width: 100%;

            height: 230px;

            background: #edf8f1;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }

        .photo img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;

        }

        .placeholder {

            font-size: 80px;

        }


        /* DETAILS */

        .details {

            padding: 20px;

        }

        .category {

            display: inline-block;

            background: #e9f7ee;

            color: #198754;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: bold;

            text-transform: uppercase;

        }

        .name {

            font-size: 23px;

            margin:
                12px 0 10px;

        }

        .info {

            color: #555;

            margin: 8px 0;

            font-size: 15px;

        }

        .price {

            color: #198754;

            font-size: 24px;

            font-weight: bold;

            margin-top: 14px;

        }

        .price span {

            color: #777;

            font-size: 14px;

            font-weight: normal;

        }

        .quantity {

            margin-top: 10px;

            font-weight: bold;

            color: #555;

        }


        /* OPTION */

        .option {

            display: inline-block;

            margin-top: 14px;

            padding: 8px 12px;

            border-radius: 20px;

            background: #e9f7ee;

            color: #198754;

            font-weight: bold;

            font-size: 13px;

        }

        .delivery {

            background: #fff1e7;

            color: #d66b18;

        }


        /* DELETE */

        .delete-btn {

            width: 100%;

            border: none;

            margin-top: 16px;

            padding: 12px;

            border-radius: 10px;

            background: #fff0f0;

            color: #c0392b;

            font-weight: bold;

            cursor: pointer;

        }

        .delete-btn:hover {

            background: #ffe0e0;

        }


        /* EMPTY */

        .empty {

            background: white;

            padding: 50px 20px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.06);

        }

        .empty-icon {

            font-size: 70px;

        }

        .empty h2 {

            margin-bottom: 8px;

        }

        .empty p {

            color: #666;

        }


        @media(max-width:600px) {

            .container {

                width: 92%;

            }

            #productsContainer {

                grid-template-columns: 1fr;

            }

            .photo {

                height: 250px;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">

        🌱 FarmConnect

    </div>

    <a
        href="farmer-dashboard.html"
        class="back-btn">

        ← Back

    </a>

</header>



<!-- MAIN -->

<main class="container">


    <div class="heading">

        <h1>

            🌾 My Products

        </h1>

        <p id="productCount">

            Loading products...

        </p>

    </div>


    <a
        href="add-product.html"
        class="add-btn">

        ➕ Add New Product

    </a>


    <div
        id="productsContainer">

    </div>


</main>



<script>


// ==========================================
// LOAD FARMER PRODUCTS
// ==========================================

function loadProducts() {


    const container =
        document.getElementById(
            "productsContainer"
        );


    const count =
        document.getElementById(
            "productCount"
        );


    let products = [];


    try {

        const saved =
            localStorage.getItem(
                "farmConnectProducts"
            );


        if (saved) {

            products =
                JSON.parse(saved);

        }

    }

    catch (error) {

        console.error(error);

        products = [];

    }


    if (!Array.isArray(products)) {

        products = [];

    }


    // ======================================
    // COUNT
    // ======================================

    count.innerText =
        products.length +
        (
            products.length === 1
                ? " product listed"
                : " products listed"
        );


    // ======================================
    // EMPTY
    // ======================================

    if (products.length === 0) {


        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🌾
                </div>

                <h2>
                    No Products Yet
                </h2>

                <p>
                    Add your first farm product.
                </p>

            </div>

        `;

        return;

    }


    // ======================================
    // CLEAR
    // ======================================

    container.innerHTML = "";


    // ======================================
    // CREATE CARDS
    // ======================================

    products.forEach(
        function(product, index) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "product-card";


            card.style.animationDelay =
                (
                    index * 0.08
                ) + "s";


            // CATEGORY

            let category =
                product.category ||
                "product";


            category =
                category
                    .charAt(0)
                    .toUpperCase() +
                category.slice(1);


            // ==================================
            // PHOTO
            // ==================================

            let photoHTML;


            if (
                product.image &&
                typeof product.image ===
                    "string" &&
                product.image.length > 20
            ) {


                photoHTML = `

                    <img
                        src="${product.image}"
                        alt="Product photo"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

                    <div
                        class="placeholder"
                        style="display:none;">

                        🌾

                    </div>

                `;

            }

            else {


                photoHTML = `

                    <div
                        class="placeholder">

                        ${
                            product.emoji ||
                            "🌾"
                        }

                    </div>

                `;

            }


            // ==================================
            // BUYING OPTION
            // ==================================

            let optionHTML;


            if (
                product.option ===
                "delivery"
            ) {


                optionHTML = `

                    <div
                        class="
                            option
                            delivery
                        ">

                        🚚 Delivery Available

                    </div>

                `;

            }

            else {


                optionHTML = `

                    <div
                        class="option">

                        🛍️ Self Buying

                    </div>

                `;

            }


            // ==================================
            // CARD HTML
            // ==================================

            card.innerHTML = `

                <div class="photo">

                    ${photoHTML}

                </div>


                <div class="details">


                    <div class="category">

                        ${escapeHTML(
                            category
                        )}

                    </div>


                    <div class="name">

                        ${escapeHTML(
                            product.name ||
                            "Product"
                        )}

                    </div>


                    <div class="info">

                        👨‍🌾

                        ${escapeHTML(
                            product.farmer ||
                            "Local Farmer"
                        )}

                    </div>


                    <div class="info">

                        📍

                        ${escapeHTML(
                            product.location ||
                            "Location not available"
                        )}

                    </div>


                    <div class="price">

                        ₹${Number(
                            product.price || 0
                        )}

                        <span>
                            / kg
                        </span>

                    </div>


                    <div class="quantity">

                        📦 Available:

                        ${Number(
                            product.quantity || 0
                        )}

                        kg

                    </div>


                    ${optionHTML}


                    ${
                        product.description
                            ? `

                            <div class="info">

                                📝

                                ${escapeHTML(
                                    product.description
                                )}

                            </div>

                            `
                            : ""
                    }


                    <button
                        class="delete-btn"
                        onclick="
                            deleteProduct(
                                '${String(
                                    product.id
                                ).replace(
                                    /'/g,
                                    "\\'"
                                )}'
                            )
                        ">

                        🗑️ Delete Product

                    </button>


                </div>

            `;


            container.appendChild(
                card
            );


        }
    );

}



// ==========================================
// DELETE
// ==========================================

function deleteProduct(id) {


    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    let products = [];


    try {

        products =
            JSON.parse(
                localStorage.getItem(
                    "farmConnectProducts"
                )
            ) || [];

    }

    catch (error) {

        products = [];

    }


    products =
        products.filter(
            function(product) {

                return String(product.id) !==
                    String(id);

            }
        );


    localStorage.setItem(

        "farmConnectProducts",

        JSON.stringify(
            products
        )

    );


    loadProducts();

}



// ==========================================
// SAFE TEXT
// ==========================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadProducts();

    }
);

</script>


</body>

  </html>
