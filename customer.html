<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FarmConnect | Customer</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* Category Section */

        .category-box {

            background: white;

            padding: 25px;

            border-radius: 18px;

            max-width: 600px;

            margin: 30px auto;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            text-align: center;

        }


        .category-box h2 {

            margin-bottom: 18px;

        }


        .category-spinner {

            width: 100%;

            padding: 15px;

            border-radius: 12px;

            border: 1px solid #ddd;

            font-size: 16px;

            margin-bottom: 15px;

            background: white;

        }


        /* Product Grid */

        .marketplace-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;

            max-width: 1100px;

            margin: 30px auto;

            padding: 15px;

        }


        /* Product Card */

        .market-product {

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);

            transition: 0.25s;

        }


        .market-product:hover {

            transform: translateY(-4px);

        }


        .market-product-image {

            width: 100%;

            height: 190px;

            background: #f5f5f5;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

        }


        .market-product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .demo-emoji {

            font-size: 75px;

        }


        .market-product-info {

            padding: 15px;

        }


        .market-product-info h3 {

            margin: 0 0 5px;

            font-size: 18px;

        }


        .market-price {

            font-size: 20px;

            font-weight: bold;

            margin: 5px 0;

        }


        .market-farmer {

            color: #555;

            margin: 5px 0;

        }


        .market-location {

            color: #777;

            font-size: 14px;

        }


        .buy-option {

            display: inline-block;

            margin: 8px 0;

            padding: 6px 10px;

            border-radius: 8px;

            font-size: 13px;

            background: #e8f5e9;

        }


        .market-view-btn {

            display: block;

            text-align: center;

            text-decoration: none;

            margin-top: 10px;

            padding: 11px;

            border-radius: 10px;

            background: #2e7d32;

            color: white;

            font-weight: bold;

        }


        .market-view-btn:hover {

            background: #1b5e20;

        }


        .empty-market {

            text-align: center;

            padding: 40px;

            grid-column: 1 / -1;

        }


        /* Mobile */

        @media (max-width: 600px) {

            .marketplace-grid {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 10px;

                padding: 10px;

            }


            .market-product-image {

                height: 140px;

            }


            .market-product-info {

                padding: 10px;

            }


            .market-product-info h3 {

                font-size: 16px;

            }


            .market-price {

                font-size: 17px;

            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">
        🌾 FarmConnect
    </div>

    <a
        href="index.html"
        class="secondary-btn"
    >
        Home
    </a>

</header>



<!-- CUSTOMER HERO -->

<section class="customer-section">

    <div class="section-heading">

        <h1>
            🛒 Farm Fresh Marketplace
        </h1>

        <p>
            Buy fresh products directly from nearby farmers
        </p>

    </div>



    <!-- LOCATION -->

    <div class="category-box">

        <button
            class="main-btn"
            onclick="getCustomerLocation()"
        >
            📍 Use My Location
        </button>

        <p id="locationStatus">
            Location not detected
        </p>

    </div>



    <!-- CATEGORY -->

    <div class="category-box">

        <h2>
            🛒 Shop by Category
        </h2>


        <select
            id="categorySelect"
            class="category-spinner"
        >

            <option value="">
                Select Category
            </option>

            <option value="fruits">
                🍎 Fruits
            </option>

            <option value="vegetables">
                🥕 Vegetables
            </option>

            <option value="grains">
                🌾 Grains
            </option>

        </select>


        <button
            class="main-btn"
            onclick="openCategory()"
        >
            View Products
        </button>

    </div>



    <!-- PRODUCTS -->

    <div
        id="marketplaceProducts"
        class="marketplace-grid"
    >

        <div class="empty-market">

            <h2>
                🛍️ Choose a category
            </h2>

            <p>
                Select Fruits, Vegetables or Grains
                to see products.
            </p>

        </div>

    </div>


</section>



<!-- LOCATION SCRIPT -->

<script src="js/location.js"></script>


<!-- PRODUCT SCRIPT -->

<script src="js/products.js"></script>



<script>


/* Open category */

function openCategory() {

    const category =
        document.getElementById(
            "categorySelect"
        ).value;


    if (!category) {

        alert(
            "Please select a category."
        );

        return;

    }


    showCategoryProducts(category);

}



/* Show products */

function showCategoryProducts(category) {

    const container =
        document.getElementById(
            "marketplaceProducts"
        );


    const products =
        getProductsByCategory(category);


    container.innerHTML = "";


    if (products.length === 0) {

        container.innerHTML = `

            <div class="empty-market">

                <h2>
                    No products available
                </h2>

                <p>
                    Farmers have not added products
                    in this category yet.
                </p>

            </div>

        `;

        return;

    }


    products.forEach(product => {


        /* Farmer product ID */

        const productId =
            product.farmerProduct
            ? "farmer_" + product.id
            : product.id;



        /* Buying option */

        const optionText =
            product.option === "self"
            ? "🛍 Self Buying"
            : "🚚 Delivery Available";



        /* Product image */

        let imageHTML = "";


        if (product.image) {

            imageHTML = `

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            `;

        }

        else {

            imageHTML = `

                <span class="demo-emoji">
                    ${product.emoji}
                </span>

            `;

        }



        /* Product card */

        container.innerHTML += `

            <div class="market-product">


                <div class="market-product-image">

                    ${imageHTML}

                </div>


                <div class="market-product-info">


                    <h3>
                        ${product.name}
                    </h3>


                    <div class="market-price">

                        ₹${product.price}/kg

                    </div>


                    <div class="market-farmer">

                        👨‍🌾 ${product.farmer}

                    </div>


                    <div class="market-location">

                        📍 ${
                            getProductDistance(product)
                        }

                    </div>


                    <span class="buy-option">

                        ${optionText}

                    </span>


                    <a
                        href="product.html?product=${productId}"
                        class="market-view-btn"
                    >
                        View Details
                    </a>


                </div>

            </div>

        `;

    });

}


</script>


</body>

  </html>
