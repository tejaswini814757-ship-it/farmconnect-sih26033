<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>FarmConnect | Order Confirmed</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #edf9f0,
                    #ffffff
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            animation:
                pageEnter
                0.7s
                ease-out;

        }


        @keyframes pageEnter {

            from {

                opacity: 0;

                transform:
                    translateY(80px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        .order-card {

            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 25px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.10);

        }


        .success-icon {

            width: 90px;

            height: 90px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #198754;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 48px;

            animation:
                successPop
                0.7s
                ease-out;

        }


        @keyframes successPop {

            0% {

                transform:
                    scale(0);

                opacity: 0;

            }

            70% {

                transform:
                    scale(1.15);

            }

            100% {

                transform:
                    scale(1);

                opacity: 1;

            }

        }


        h1 {

            color: #198754;

            margin:
                10px 0;

            font-size: 30px;

        }


        .message {

            color: #666;

            font-size: 16px;

            line-height: 1.6;

            margin-bottom: 25px;

        }


        .order-box {

            background: #f5faf6;

            border-radius: 15px;

            padding: 18px;

            margin-bottom: 25px;

        }


        .order-label {

            color: #777;

            font-size: 13px;

            margin-bottom: 5px;

        }


        .order-id {

            color: #222;

            font-size: 20px;

            font-weight: bold;

        }


        .status {

            display: inline-block;

            background: #dff5e7;

            color: #198754;

            padding:
                8px 15px;

            border-radius: 20px;

            font-size: 14px;

            font-weight: bold;

            margin-top: 10px;

        }


        .button {

            display: block;

            width: 100%;

            padding: 14px;

            border-radius: 11px;

            text-decoration: none;

            font-weight: bold;

            margin-top: 12px;

            transition:
                0.25s;

        }


        .primary {

            background: #198754;

            color: white;

        }


        .primary:hover {

            background: #146c43;

            transform:
                translateY(-2px);

        }


        .secondary {

            background: #edf8f1;

            color: #198754;

        }


        .secondary:hover {

            background: #dff3e6;

        }


        .thank-you {

            margin-top: 25px;

            color: #777;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="order-card">


    <div class="success-icon">

        ✓

    </div>


    <h1>

        Order Confirmed!

    </h1>


    <p class="message">

        Your order has been successfully placed.

        <br>

        Thank you for supporting local farmers! 🌱

    </p>


    <div class="order-box">


        <div class="order-label">

            ORDER ID

        </div>


        <div
            class="order-id"
            id="orderId">

            FC-000000

        </div>


        <div class="status">

            ✓ Order Placed

        </div>


    </div>


    <a
        href="products.html"
        class="button primary">

        🛒 Continue Shopping

    </a>


    <a
        href="customer.html"
        class="button secondary">

        🏠 Back to Marketplace

    </a>


    <div class="thank-you">

        🌾 Direct from Farmers • Fair Prices

    </div>


</div>



<script>


/* =====================================
   GENERATE ORDER ID
===================================== */

function generateOrderId() {


    const randomNumber =

        Math.floor(
            100000 +
            Math.random() * 900000
        );


    return "FC-" + randomNumber;

}


document.getElementById(
    "orderId"
).innerText =
    generateOrderId();


</script>


</body>

</html>
